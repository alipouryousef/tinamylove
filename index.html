<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برای تینا ❤️</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #ff4d85;
            --secondary: #ff7eb3;
            --bg-gradient-1: #ffb6c1;
            --bg-gradient-2: #e0c3fc;
            --text-color: #4a0e2e;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            /* Disable pull-to-refresh and selection to make it feel like an app */
            touch-action: none; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ambient-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.5);
            font-size: 24px;
            animation: floatUp linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.2) rotate(45deg); opacity: 0; }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(255, 77, 133, 0.2);
            width: 90%;
            max-width: 400px;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        p {
            color: var(--text-color);
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative; 
            min-height: 50px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            outline: none;
        }

        .btn-yes {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            animation: pulseBtn 2s infinite;
            z-index: 5;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 133, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 77, 133, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 133, 0); }
        }

        .btn-no {
            background: #ffffff;
            color: var(--primary);
            border: 2px solid var(--primary);
            /* z-index needs to be high for mobile teleportation */
            position: relative;
            z-index: 9999;
            /* Smooth transition when running away */
            transition: left 0.3s ease-out, top 0.3s ease-out;
        }

        .success-screen {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .success-screen.active {
            display: flex;
            opacity: 1;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .ring-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            animation: floatRing 3s ease-in-out infinite;
        }

        @keyframes floatRing {
            0%, 100% { transform: translateY(0) rotateX(10deg); }
            50% { transform: translateY(-10px) rotateX(20deg); }
        }

        .ring-band {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #FFDF00; 
            box-shadow: 
                0 0 15px rgba(255, 223, 0, 0.8),
                inset 0 0 15px rgba(255, 223, 0, 0.8),
                0 10px 10px rgba(0,0,0,0.1);
        }

        .ring-diamond {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0f7fa, #b2ebf2);
            border-radius: 4px;
            box-shadow: 
                0 0 20px #ffffff, 
                0 0 40px rgba(0, 255, 255, 0.6),
                inset 0 0 10px rgba(255,255,255,1);
            animation: sparkle 1.5s infinite alternate;
        }

        @keyframes sparkle {
            0% { box-shadow: 0 0 10px #ffffff, 0 0 20px rgba(0, 255, 255, 0.4); }
            100% { box-shadow: 0 0 30px #ffffff, 0 0 60px rgba(0, 255, 255, 0.8); }
        }

        .success-msg {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        #loveVideo {
            width: 100%;
            max-width: 280px;
            border-radius: 15px;
            border: 3px solid rgba(255,255,255,0.7);
            box-shadow: 0 10px 20px rgba(255,77,133,0.3);
            pointer-events: none; /* User cannot interact with it */
        }
    </style>
</head>
<body>

    <div id="ambient-container"></div>

    <div class="card" id="main-card">
        
        <!-- Proposal Screen -->
        <div id="proposal-screen">
            <h1>تینا جان... 💖</h1>
            <p>با من وارد رابطه میشی قربونت برم؟</p>
            <div class="button-group">
                <button class="btn btn-yes" id="yes-btn">بله 🥰</button>
                <button class="btn btn-no" id="no-btn">نه 🥺</button>
            </div>
        </div>

        <!-- Success Screen -->
        <div class="success-screen" id="success-screen">
            <div class="ring-wrapper">
                <div class="ring-band"></div>
                <div class="ring-diamond"></div>
            </div>
            <div class="success-msg">عاشقتم که! ❤️</div>
            <!-- Muted is added for autoplay compatibility, but since the user triggered it via click, we can play it. -->
            <video id="loveVideo" src="1.mp4" loop playsinline muted></video>
        </div>

    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const proposalScreen = document.getElementById('proposal-screen');
        const successScreen = document.getElementById('success-screen');
        const loveVideo = document.getElementById('loveVideo');

        function createHearts() {
            const container = document.getElementById('ambient-container');
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('ambient-heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 6 + 4) + 's'; 
                heart.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(heart);
            }
        }
        createHearts();

        function teleportNoButton(e) {
            if (e && e.cancelable) e.preventDefault();

            // Bring button out of standard flow so it can move anywhere
            if (noBtn.parentNode !== document.body) {
                noBtn.style.position = 'fixed';
                noBtn.style.right = 'auto'; 
                noBtn.style.bottom = 'auto';
                noBtn.style.margin = '0';
                document.body.appendChild(noBtn);
            }

            const padding = 20; // Ensure it doesn't touch the exact edge
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;
            
            // Math.max guarantees it won't go into negative coordinates (offscreen left/top)
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        document.addEventListener('touchmove', (e) => {
            // Check if "No" button still exists in the DOM
            if (!document.contains(noBtn)) return;

            const touch = e.touches[0];
            const btnRect = noBtn.getBoundingClientRect();
            
            // Calculate center of the "No" button
            const btnCenterX = btnRect.left + (btnRect.width / 2);
            const btnCenterY = btnRect.top + (btnRect.height / 2);
            
            // Calculate distance between finger and button center
            const distance = Math.hypot(touch.clientX - btnCenterX, touch.clientY - btnCenterY);
            
            // If finger gets closer than 80px, teleport!
            if (distance < 80) {
                teleportNoButton();
            }
        }, { passive: false }); // Non-passive to allow smooth interaction block if needed

        // Direct tap handling - impossible to click!
        noBtn.addEventListener('touchstart', teleportNoButton, { passive: false });
        
        // Mouse handling for desktop/testing
        noBtn.addEventListener('mouseover', teleportNoButton);
        noBtn.addEventListener('mousemove', teleportNoButton);

        yesBtn.addEventListener('click', () => {
            // Completely remove the "No" button
            if (noBtn.parentNode) {
                noBtn.parentNode.removeChild(noBtn);
            }
            
            // Switch screens
            proposalScreen.style.display = 'none';
            successScreen.classList.add('active');

            // Play video (Autoplay works here because of the explicit user 'click' on the Yes button)
            loveVideo.play().catch(err => console.log("Video play failed:", err));

            // Fire celebration confetti
            fireConfetti();
        });

        function fireConfetti() {
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#ff4d85', '#ff7eb3', '#ffffff', '#FFDF00']
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#ff4d85', '#ff7eb3', '#ffffff', '#FFDF00']
                }));
            }, 250);
        }
    </script>
</body>
</html>
