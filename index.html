<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برای تینا ❤️</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #ff4d85;
            --secondary: #ff7eb3;
            --bg-gradient-1: #ffb6c1;
            --bg-gradient-2: #e0c3fc;
            --text-color: #4a0e2e;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            min-height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ambient-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            animation: floatUp linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.2) rotate(45deg); opacity: 0; }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 77, 133, 0.2);
            width: 90%;
            max-width: 450px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
            font-weight: 800;
        }

        p {
            color: var(--text-color);
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            position: relative;
        }

        .btn {
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-yes {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1.2rem;
            padding: 12px 40px;
            box-shadow: 0 8px 20px rgba(255, 77, 133, 0.4);
            z-index: 5;
            white-space: nowrap;
            /* Will scale up with JS */
            transform-origin: center;
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.8);
            color: var(--primary);
            border: 2px solid var(--primary);
            font-size: 1.2rem;
            padding: 12px 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            /* Will scale down with JS */
            transform-origin: center;
        }

        #proposal-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transition: opacity 0.5s ease;
        }

        .success-screen {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            width: 100%;
        }

        .success-screen.active {
            display: flex;
            opacity: 1;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .ring-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            animation: floatRing 3s ease-in-out infinite;
        }

        @keyframes floatRing {
            0%, 100% { transform: translateY(0) rotateX(10deg); }
            50% { transform: translateY(-15px) rotateX(20deg); }
        }

        .ring-band {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #FFDF00; 
            box-shadow: 
                0 0 15px rgba(255, 223, 0, 0.8),
                inset 0 0 15px rgba(255, 223, 0, 0.8);
        }

        .ring-diamond {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0f7fa, #b2ebf2);
            border-radius: 4px;
            box-shadow: 
                0 0 20px #ffffff, 
                0 0 40px rgba(0, 255, 255, 0.6),
                inset 0 0 10px rgba(255,255,255,1);
            animation: sparkle 1.5s infinite alternate;
        }

        @keyframes sparkle {
            0% { box-shadow: 0 0 10px #ffffff, 0 0 20px rgba(0, 255, 255, 0.4); }
            100% { box-shadow: 0 0 30px #ffffff, 0 0 60px rgba(0, 255, 255, 0.8); }
        }

        .success-msg {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        #loveVideo {
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            border: 4px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(255,77,133,0.3);
            background-color: #000;
            /* Added object-fit so the video fills its bounds elegantly */
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="ambient-container"></div>

    <div class="card" id="main-card">
        
        <!-- Proposal Screen -->
        <div id="proposal-screen">
            <h1>تینا جانم... 💖</h1>
            <p>با من وارد رابطه میشی قربونت برم؟</p>
            <div class="button-group">
                <button class="btn btn-yes" id="yes-btn">بله 🥰</button>
                <button class="btn btn-no" id="no-btn">نه 😢</button>
            </div>
        </div>

        <!-- Success Screen -->
        <div class="success-screen" id="success-screen">
            <div class="ring-wrapper">
                <div class="ring-band"></div>
                <div class="ring-diamond"></div>
            </div>
            <div class="success-msg">می‌دونستم قبول می‌کنی! ❤️</div>
            <!-- Video WITHOUT muted attribute so it plays with sound! -->
            <video id="myVideo" src="1.mp4" loop playsinline></video>
        </div>

    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const proposalScreen = document.getElementById('proposal-screen');
        const successScreen = document.getElementById('success-screen');
        const loveVideo = document.getElementById('myVideo');

        // Cheeky/Stubborn phrases for the "No" button
        const noPhrases = [
            "دستت خورد حتما! 😏", 
            "اصلا مگه دست خودته؟ 🤨", 
            "این دکمه خرابه! 🙄", 
            "گزینه نه تحریمه! 🚫", 
            "الان غیب میشما... 🫠"
        ];
        
        let clickCount = 0;

        // Generate floating hearts in the background
        function createHearts() {
            const container = document.getElementById('ambient-container');
            for (let i = 0; i < 25; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('ambient-heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 5 + 4) + 's'; 
                heart.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(heart);
            }
        }
        createHearts();

        // The Cheeky Logic for "No" Button
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Check if we reached the end of phrases
            if (clickCount < noPhrases.length) {
                noBtn.innerText = noPhrases[clickCount];
            }

            clickCount++;

            // If clicked enough times (after the last phrase), completely hide it
            if (clickCount > noPhrases.length) {
                noBtn.style.display = 'none';
                yesBtn.style.transform = `scale(1.8)`; // Make YES button massive
                return;
            }

            // Increase Yes size massively with transform scale
            let yesScale = 1 + (clickCount * 0.15);
            yesBtn.style.transform = `scale(${yesScale})`;
            
            // Decrease No size
            let noScale = 1 - (clickCount * 0.15);
            noBtn.style.transform = `scale(${Math.max(0, noScale)})`;
            
            // Fade out No button gradually
            noBtn.style.opacity = Math.max(0, 1 - (clickCount * 0.15));
        });

        // The Success Logic for "Yes" Button
        yesBtn.addEventListener('click', () => {
            // Completely hide the proposal screen (both buttons and text disappear)
            proposalScreen.style.display = 'none';
            
            // Show the success screen
            successScreen.classList.add('active');

            // Force play video WITH SOUND. 
            // Browsers allow unmuted autoplay if triggered by a direct user click event like this!
            loveVideo.play().catch(err => {
                console.log("Video play failed:", err);
                // Fallback: If for some strict reason it blocks, we can unmute explicitly just in case
                loveVideo.muted = false;
                loveVideo.play();
            });

            // Fire celebration confetti
            fireConfetti();
        });

        // Beautiful Confetti Animation function
        function fireConfetti() {
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#ff4d85', '#ff7eb3', '#ffffff', '#FFDF00']
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#ff4d85', '#ff7eb3', '#ffffff', '#FFDF00']
                }));
            }, 250);
        }
    </script>
</body>
</html>
